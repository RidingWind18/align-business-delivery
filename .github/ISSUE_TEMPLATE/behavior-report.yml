name: Behavior report
description: Report scope drift, baseline loss, prototype consumption, or recovery problems
title: "[Behavior]: "
labels:
  - behavior
body:
  - type: markdown
    attributes:
      value: |
        Please remove customer data, internal links, credentials, source code, and private business documents before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Skill tag or commit used for the run.
      placeholder: v0.2.1-rc.1
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool and model
      description: Tool, model, and reasoning mode when known.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Problem category
      options:
        - Requirement or baseline loss
        - Scope expansion
        - Prototype or page mismatch
        - Interrupted-task recovery
        - Module dependency or completion-state confusion
        - Evidence or completion overclaim
        - Skill routing or coexistence
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Sanitized original request
      description: Provide the smallest public input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, customer data, internal links, proprietary source code, and non-public business documents.
          required: true
